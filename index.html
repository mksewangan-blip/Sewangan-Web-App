<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f47b20"><title>Sewangan Member</title><link rel="stylesheet" href="style.css"></head><body>
<div id="toast"></div>
<section id="loginPage" class="login-page"><div class="login-card"><img src="logo.png" class="login-logo"><h1>Sewangan</h1><p>Member App</p><form id="loginForm"><label>Registered Mobile Number</label><input id="loginPhone" inputmode="numeric" required><label>Password</label><div class="pass"><input id="loginPassword" type="password" required><button type="button" id="togglePass">👁</button></div><button class="primary" type="submit">Login</button></form></div></section>
<section id="appPage" class="app hidden"><header><div class="brand"><img src="logo.png"><b>Sewangan</b></div><button class="icon-btn" id="bellBtn">🔔<span id="bellCount"></span></button></header><main>
<div class="hero"><div><small>Welcome</small><h2 id="memberName">Member</h2><p id="designation"></p><p id="office"></p><span id="memberId" class="pill"></span></div><button class="avatar" id="profileBtn">👤</button></div>
<form id="globalSearchForm" class="search"><span>⌕</span><input id="globalSearch" autocomplete="off" placeholder="Search members, receipts, projects, events..."><button type="submit">Search</button></form>
<div class="quick"><button data-action="donation">₹<span>Add Donation</span></button><button data-action="member">👤<span>Register Member</span></button><button data-action="activity">✓<span>Add Activity</span></button><button data-action="projects">📁<span>Projects</span></button></div>
<h3>Services</h3><div id="modules" class="modules"></div><div id="panel" class="panel hidden"></div></main>
<nav><button data-nav="home">⌂<span>Home</span></button><button data-nav="members">👥<span>Members</span></button><button data-nav="projects">📁<span>Projects</span></button><button data-nav="profile">👤<span>Profile</span></button></nav></section>
<script src="config.js"></script><script src="app.js"></script></body></html>
