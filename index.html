<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name=theme-color content="#08783e"><title>Sewangan</title><link rel=stylesheet href=style.css></head><body>
<section id=login class=login><div class=loginbox><img class=logo src=assets/logo.png onerror="this.style.display='none'"><h2>Sewangan</h2><div class=sub>Member & Office Management App</div><label>Registered Mobile Number</label><input id=phone inputmode=numeric placeholder="10-digit mobile number"><label>Password</label><input id=pass type=password placeholder=Password><button class="btn full" onclick=login()>LOGIN</button><p id=msg></p><div class=sub style="margin-top:15px">Authorized members only</div></div></section>
<div id=app class="app" hidden><header class=top><img src=assets/logo.png onerror="this.style.display='none'"><div class=brand><b>Sewangan</b><small id=who></small></div><div class=right><button class=iconbtn onclick=refreshApp()>↻</button><button class=iconbtn onclick=logout()>⎋</button></div></header><main id=view></main><nav class=bottom><button id=bhome class=active onclick=home()><b>⌂</b>Home</button><button id=bmodules onclick=modules()><b>▦</b>Modules</button><button onclick=offices()><b>⌘</b>Network</button><button onclick=profile()><b>●</b>Profile</button></nav></div>
<script src=config.js></script><script src=app.js></script></body></html>
