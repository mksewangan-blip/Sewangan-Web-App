<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Goods Donation</title><link rel=stylesheet href=style.css></head><body><header><img src=assets/sewangan-logo.png><h2>Goods Donation</h2></header><main style="max-width:720px;margin:auto"><div class=card><label>Name</label><input id=name><label>Mobile</label><input id=mobile><label>Items</label><textarea id=items></textarea><div class=two><div><label>Quantity</label><input id=qty></div><div><label>Unit</label><input id=unit></div></div><label>Condition</label><select id=condition><option>New</option><option>Used - Good</option><option>Used - Fair</option></select><label>Estimated Value</label><input id=value type=number><label>Collection</label><select id=collection><option>Head Office Submission</option><option>Doorstep Pickup</option></select><label>Address</label><textarea id=address></textarea><button onclick=goods()>Submit</button><p id=msg></p></div></main><script src=config.js></script><script src=app.js></script></body></html>
